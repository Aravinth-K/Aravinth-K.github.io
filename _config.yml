title: Aravinth Kulanthaivelu
description: Notes, explorations, and things I find interesting
url: https://akulanthaivelu.com
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
  parse_block_html: true

sass:
  style: compressed

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

enable_math: true

# Hide the Series section until there is enough to fill it:
# removes the nav link and the series banner on posts. The /series/
# page still builds, just unadvertised. Flip to true to bring it back.
show_series: false

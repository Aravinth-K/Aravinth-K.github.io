title: Aravinth Kulanthaivelu
description: Things I find interesting
url: https://akulanthaivelu.com
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
  parse_block_html: true

sass:
  style: compressed

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

# Contact and profile links shown on the About page ("Elsewhere").
# Leave a value blank to hide that pill. RSS is always shown.
contacts:
  email: aravinth.kulanthaivelu@outlook.com
  scholar: BGQOXTQAAAAJ                          # Google Scholar ID — the ?user= part of your profile URL
  linkedin: aravinth-kulanthaivelu-54020aa3      # LinkedIn slug — the part after linkedin.com/in/
  github: Aravinth-K

enable_math: true

# Hide the Series section until there is enough to fill it:
# removes the nav link and the series banner on posts. The /series/
# page still builds, just unadvertised. Flip to true to bring it back.
show_series: false

# Hide the palette picker: everyone gets the default palette (the
# first entry in _data/palettes.yml) and stored preferences are
# ignored while hidden. The system stays intact — ?palette=name
# still works for a single page load, and flipping this to true
# brings the picker back.
show_palette_picker: false

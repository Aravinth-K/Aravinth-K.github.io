# Colour palettes — the single source of truth.
#
# The FIRST palette is the site default. Each palette provides a
# full set of tokens for light and dark; assets/css/main.scss turns
# these into CSS custom-property blocks, and the header picker is
# generated from the same list. To try a new scheme, add an entry
# here; to retire one, delete it. Nothing else needs editing.
#
# Token guide:
#   paper*        page + raised/recessed surfaces
#   ink*          text (primary / secondary / faint)
#   accent        text-safe link colour   accent-strong: hover
#   thread*       decorative strokes (the threads) + highlight
#   thread-tint*  translucent thread washes for fills
#   glow*         thread glow shadows
#   counter       counterpoint colour (3D surface, occasional accents)
#   line*         hairline borders
#   header-veil   translucent header backdrop (match paper)
#   selection     text-selection wash
#   syn-*         code highlighting


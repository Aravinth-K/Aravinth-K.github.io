<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#FBF7EF">

  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <script>
    // Stamp theme and palette before first paint to avoid a flash.
    // Palettes are defined in _data/palettes.yml; the maps below are
    // generated from it at build time.
    (function () {
      var PAPER = { {% for p in site.data.palettes %}'{{ p.name }}': ['{{ p.light.paper }}', '{{ p.dark.paper }}']{% unless forloop.last %}, {% endunless %}{% endfor %} };
      {% assign first_palette = site.data.palettes | first %}var DEFAULT_PALETTE = '{{ first_palette.name }}';

      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { /* ignore */ }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }

      var p = null;
      try { p = new URLSearchParams(window.location.search).get('palette'); } catch (e) { /* ignore */ }
      if (p && PAPER[p]) {
        try { localStorage.setItem('palette', p); } catch (e) { /* ignore */ }
      } else {
        p = null;
      }
      if (!p) {
        try { p = localStorage.getItem('palette'); } catch (e) { /* ignore */ }
      }
      if (!p || !PAPER[p]) p = DEFAULT_PALETTE;

      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.setAttribute('data-palette', p);

      // Entrance animations play once per visit — every page after
      // the first renders settled.
      try {
        if (sessionStorage.getItem('arrived')) root.setAttribute('data-revisit', '');
      } catch (e) { /* ignore */ }

      var m = document.querySelector('meta[name="theme-color"]');
      if (m && PAPER[p]) m.setAttribute('content', PAPER[p][t === 'dark' ? 1 : 0]);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..640;1,9..144,340..640&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Archivo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 8 h18 M7 24 h18 M11 8 v16 M21 8 v16 M11 11.5 h10 M11 16 h10 M11 20.5 h10' stroke='%23D4622B' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M21 24 q6 3 9 1' stroke='%23D4622B' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>

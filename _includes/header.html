<header class="site-header">
  <nav class="nav-container" aria-label="Site">
    <a href="{{ '/' | relative_url }}" class="site-title">
      <svg class="title-spool" width="17" height="17" viewBox="0 0 17 17" aria-hidden="true">
        <path d="M3,4.5 h11 M3,12.5 h11 M5.2,4.5 v8 M11.8,4.5 v8 M5.2,6.6 h6.6 M5.2,8.5 h6.6 M5.2,10.4 h6.6"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M11.8,12.5 q3,1.8 4.5,0.8" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" fill="none"/>
      </svg>
      <span class="title-text">{{ site.title }}</span>
    </a>
    <div class="nav-right">
      <div class="nav-links">
        <a class="thread-link" href="{{ '/blog/' | relative_url }}">Notes</a>
        <a class="thread-link" href="{{ '/series/' | relative_url }}">Series</a>
        <a class="thread-link" href="{{ '/library/' | relative_url }}">Library</a>
        <a class="thread-link" href="{{ '/about/' | relative_url }}">About</a>
      </div>
      <div class="palette-picker">
        <button class="palette-toggle" type="button" aria-label="Choose colour palette"
                aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="5" cy="6" r="2.6" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <circle cx="11" cy="6" r="2.6" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <circle cx="8" cy="10.8" r="2.6" stroke="currentColor" stroke-width="1.2" fill="none"/>
          </svg>
        </button>
        <div class="palette-menu" hidden>
          <span class="palette-menu-label">Thread &amp; paper</span>
          {% for palette in site.data.palettes %}
          <button class="palette-option" type="button" data-palette="{{ palette.name }}">
            <span class="palette-swatches" aria-hidden="true">
              <span class="sw sw-paper"></span><span class="sw sw-thread"></span><span class="sw sw-counter"></span>
            </span>
            <span class="palette-name">{{ palette.label }}</span>
            <svg class="palette-current-knot" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <circle cx="5" cy="5" r="3.4" fill="currentColor"/>
            </svg>
          </button>
          {% endfor %}
        </div>
      </div>
      <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
        <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3" fill="none"/>
          <path d="M8 1.2v1.8M8 13v1.8M1.2 8h1.8M13 8h1.8M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M12.8 3.2l-1.3 1.3M4.5 11.5l-1.3 1.3"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.2 9.8A5.8 5.8 0 0 1 6.2 2.8a5.8 5.8 0 1 0 7 7z"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
    </div>
  </nav>
</header>
